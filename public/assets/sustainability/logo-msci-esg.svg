<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="100%" height="100%">
  <!-- MSCI Text -->
  <text x="20" y="58" font-family="'Manrope', sans-serif" font-size="28" font-weight="900" fill="#1e293b" letter-spacing="1">MSCI</text>
  <text x="20" y="80" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="2">ESG RATINGS</text>
  <!-- Orange BBB Circle Badge -->
  <circle cx="205" cy="62" r="32" fill="#f59e0b" />
  <text x="205" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="0.5">BBB</text>
  
  <!-- Divider Line -->
  <line x1="20" y1="96" x2="255" y2="96" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Rating Scale Bar -->
  <g transform="translate(20, 110)">
    <!-- CCC -->
    <rect x="0" y="0" width="28" height="14" fill="#f1f5f9" rx="2" />
    <text x="14" y="10" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="7" font-weight="700" fill="#64748b">CCC</text>
    <!-- B -->
    <rect x="31" y="0" width="20" height="14" fill="#f1f5f9" rx="2" />
    <text x="41" y="10" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="7" font-weight="700" fill="#64748b">B</text>
    <!-- BB -->
    <rect x="54" y="0" width="24" height="14" fill="#f1f5f9" rx="2" />
    <text x="66" y="10" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="7" font-weight="700" fill="#64748b">BB</text>
    <!-- BBB (Active highlighted in orange) -->
    <rect x="81" y="0" width="28" height="14" fill="#f59e0b" rx="2" />
    <text x="95" y="10" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="7" font-weight="800" fill="#ffffff">BBB</text>
    <!-- A -->
    <rect x="112" y="0" width="20" height="14" fill="#f1f5f9" rx="2" />
    <text x="122" y="10" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="7" font-weight="700" fill="#64748b">A</text>
    <!-- AA -->
    <rect x="135" y="0" width="24" height="14" fill="#f1f5f9" rx="2" />
    <text x="147" y="10" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="7" font-weight="700" fill="#64748b">AA</text>
    <!-- AAA -->
    <rect x="162" y="0" width="28" height="14" fill="#f1f5f9" rx="2" />
    <text x="176" y="10" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="7" font-weight="700" fill="#64748b">AAA</text>
  </g>
</svg>
