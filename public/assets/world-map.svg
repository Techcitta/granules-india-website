<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Granules global presence map</title>
  <desc id="desc">A stylized world map highlighting Granules operations across North America, Europe and India.</desc>
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8cbff"/>
      <stop offset=".5" stop-color="#78adff"/>
      <stop offset="1" stop-color="#4d8ff7"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#1467eb" opacity=".42"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="12"/>
      <feColorMatrix values="0 0 0 0 0.12 0 0 0 0 0.36 0 0 0 0 0.74 0 0 0 .18 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <path id="north-america" d="M80 194 104 153l50-12 28-34 69-11 49 24 56-4 51 28 46 6 29 29-17 24-39 4-11 29-37 6-25 42-43 9-17 37-35 6-14-29-47-10-26-37-48-4-39-29-39-3-26-20 31-18Z"/>
    <path id="south-america" d="M376 333 421 319l53 22 19 33-11 32 7 37-28 51-12 54-31 54-27-3-10-55-25-46 7-41-20-38 13-42-14-28Z"/>
    <path id="europe" d="M550 178 578 153l35 8 29-14 43 10 20 24-24 16-16 33-39-5-21 19-31-10-18 13-24-19 15-24-14-14Z"/>
    <path id="africa" d="M555 266 602 238l61 10 39 48-8 54-24 30-13 58-38 41-30-28-8-60-27-38-22-57Z"/>
    <path id="asia" d="M674 178 711 141l56 8 37-18 58 20 60-5 48 30 72 10 58 38-15 33-64 7-21 28-57-8-32 23-40-18-44 14-18 50-26 32-33-27-5-44-45-13-28-41-48-11 31-35Z"/>
    <path id="australia" d="M929 411 971 383l60 8 44 38-8 48-45 29-59-10-37 18-31-35 13-37Z"/>
    <path id="greenland" d="M347 52 411 36l47 30-16 47-60 10-45-27Z"/>
  </defs>
  <g filter="url(#shadow)" fill="url(#land)" stroke="#f2f7ff" stroke-width="4" stroke-linejoin="round">
    <use href="#north-america"/><use href="#south-america"/><use href="#europe"/><use href="#africa"/><use href="#asia"/><use href="#australia"/><use href="#greenland"/>
  </g>
  <g fill="url(#dots)" opacity=".92">
    <use href="#north-america"/><use href="#south-america"/><use href="#europe"/><use href="#africa"/><use href="#asia"/><use href="#australia"/><use href="#greenland"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="1.5" opacity=".72">
    <path d="M122 211c87-42 181-46 280-18M576 282c32 19 63 26 102 22M705 217c103-22 200-13 286 29M950 429c31 5 63 17 87 40"/>
  </g>
</svg>
