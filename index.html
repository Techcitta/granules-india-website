    <script>
      (function() {
        var host = window.location.host;
        var hostname = window.location.hostname;

        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var isLocal = hostname === 'localhost' || hostname === '127.0.0.1';

        // Clean public_html artifacts

        if (!cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;
        cleanPath = cleanPath.replace(/\/+/g, '/');

        var trimmed = cleanPath.length > 1 && cleanPath.endsWith('/') ? cleanPath.slice(0, -1) : cleanPath;
        var lower = trimmed.toLowerCase();
        var targetRoute = trimmed;
        var targetHash = hash;

        // Map all legacy Google-indexed URLs & search sitelinks
        if (lower === '/granules-usa/management-team' || lower === '/management-team' || lower.indexOf('/about-us/our-leadership') === 0 || lower.indexOf('/about-us/leadership') === 0 || lower.indexOf('/about-us/our-board') === 0) {
          targetRoute = '/company/leadership';
        } else if (lower.indexOf('/about-us/our-journey') === 0 || lower.indexOf('/about-us/milestones') === 0) {
          targetRoute = '/company/milestone';
        } else if (lower.indexOf('/about-us/operational-excellence') === 0 || lower.indexOf('/operational-excellence') === 0) {
          targetRoute = '/company/operational-excellence';
        } else if (lower.indexOf('/our-purpose-vision-values') === 0) {
          targetRoute = '/company';
        } else if (lower.indexOf('/about-us/research-development') === 0 || lower.indexOf('/research-development') === 0 || lower === '/rnd') {

          targetRoute = '/company';
        } else if (lower === '/contact-us' || lower.indexOf('/contact-us/') === 0 || lower === '/register-as-supplier' || lower.indexOf('/register-as-supplier/') === 0) {
          targetRoute = '/contact';
        } else if (lower === '/locations' || lower.indexOf('/locations/') === 0) {
          targetRoute = '/business/facilities';
        } else if (lower === '/esg-profile' || lower === '/esg-world') {
          targetRoute = '/sustainability/esg-profile';
        } else if (lower.indexOf('/careers/testimonials') === 0 || lower.indexOf('/granules-usa/careers/testimonials') === 0) {
          targetRoute = '/careers/life-at-granules';
        } else if (lower.indexOf('/careers/current-openings') === 0 || lower.indexOf('/granules-usa/careers') === 0) {
          targetRoute = '/careers';
        } else if (lower.indexOf('/granules-usa') === 0) {
          targetRoute = '/company/global-subsidiaries';
        } else if (lower === '/terms-of-use' || lower === '/terms' || lower === '/terms-condition') {

        } else if (lower.indexOf('/investors/investor-resources/buyback') === 0 || lower.indexOf('/investors/investor-resources/policies') === 0 || lower.indexOf('/investors/investor-resources/investor-presentation') === 0) {
          targetRoute = '/investor';
          if (!targetHash) targetHash = '#sec-investor-resources';
        } else if (lower.indexOf('/investors/other-information') === 0) {
          targetRoute = '/investor';
          if (!targetHash) targetHash = '#sec-other-info';
        } else if (lower.indexOf('/investors/notice-disclosures') === 0) {

        } else if (lower.indexOf('/products/pharmaceutical-formulation') === 0 || lower === '/products/pfi') {

        } else if (lower.indexOf('/products/finished-dosages') === 0 || lower === '/products/fd') {

        } else if (lower.indexOf('/wp-content/') === 0) {
          targetRoute = '/investor';
        }

        var isApex = !isLocal && (hostname.toLowerCase() === 'granulesindia.com');
        var needsHttps = !isLocal && window.location.protocol === 'http:';
        var isRedirectNeeded = targetRoute !== pathname || targetHash !== hash || isApex || needsHttps;

        if (isRedirectNeeded) {
          var targetHost = isApex ? 'www.granulesindia.com' : host;
          var targetProtocol = (needsHttps || isApex) ? 'https:' : window.location.protocol;
          window.location.replace(targetProtocol + '//' + targetHost + targetRoute + search + targetHash);
        }
      })();
