<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Gear shape -->
  <g transform="translate(80, 80)">
    <!-- Gear teeth -->
    <path d="M -15,-60 L 15,-60 L 12,-48 L -12,-48 Z" fill="#eab308" stroke="#1d4ed8" stroke-width="2" />
    <path d="M 40,-45 L 60,-25 L 48,-18 L 32,-35 Z" fill="#eab308" stroke="#1d4ed8" stroke-width="2" />
    <path d="M 50,0 L 65,15 L 50,25 L 35,12 Z" fill="#eab308" stroke="#1d4ed8" stroke-width="2" />
    <path d="M 30,40 L 15,60 L 2,48 L 18,32 Z" fill="#eab308" stroke="#1d4ed8" stroke-width="2" />
    <path d="M -15,48 L -15,62 L -30,62 L -30,48 Z" fill="#eab308" stroke="#1d4ed8" stroke-width="2" />
    <path d="M -48,30 L -62,15 L -48,2 L -35,18 Z" fill="#eab308" stroke="#1d4ed8" stroke-width="2" />
    <path d="M -60,-15 L -60,-30 L -48,-30 L -48,-15 Z" fill="#eab308" stroke="#1d4ed8" stroke-width="2" />
    <path d="M -45,-40 L -25,-60 L -18,-48 L -35,-32 Z" fill="#eab308" stroke="#1d4ed8" stroke-width="2" />
    
    <!-- Central Cog Body -->
    <circle cx="0" cy="0" r="48" fill="#fef08a" stroke="#1d4ed8" stroke-width="3" />
    <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" />
    
    <!-- Blue Banner across middle -->
    <rect x="-34" y="-7" width="68" height="14" fill="#1d4ed8" rx="2" />
    <text x="0" y="3.5" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="0.5">FTAPCCI</text>
    
    <!-- Factory & Wheat icons inside top and bottom -->
    <path d="M -16,-14 L -16,-22 L -8,-22 L -8,-18 L -4,-18 L -4,-24 L 4,-24 L 4,-14 Z" fill="#1e293b" />
    <path d="M 8,-14 L 14,-22 L 18,-20 L 12,-12 Z" fill="#22c55e" />
  </g>
</svg>
